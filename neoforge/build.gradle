plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'Elite X Quality Guns NeoForge'
}

neoForge {
    version = project.neo_version

    // Minecraft 26.1+ ships unobfuscated class names, so no Parchment or
    // mappings configuration is used anymore.

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources {
            // Shared content pack and assets (single source of truth).
            srcDir rootProject.file('common/src/main/resources')
            srcDir 'src/generated/resources'
        }
    }
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // 26.3 NeoForge port of TaCZ (Renovated). Resolved from CurseMaven as a
    // plain jar because the 26.3 ModDevGradle toolchain is unobfuscated too.
    implementation "curse.maven:unofficial-tacz-renovated-1663324:9089853"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = java_version as int
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Elite X Quality Guns",
                "Specification-Vendor"    : "Argos Williams",
                "Specification-Version"   : project.version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Argos Williams",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "Built-On-Minecraft"      : minecraft_version
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${rootProject.projectDir}/mcmodsrepo"
        }
    }
}
