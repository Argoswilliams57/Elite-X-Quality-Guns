plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'Elite X Quality Guns NeoForge'
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources {
            // Shared content pack and assets (single source of truth).
            srcDir rootProject.file('common/src/main/resources')
            srcDir 'src/generated/resources'
        }
    }
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // TaCZ NeoForge 1.21.1 port and its client-side mesh loader.
    implementation "curse.maven:tacz-1-21-1-1353462:${tacz_neoforge_file}"
    implementation "curse.maven:tacz-mesh-loader-1549522:${tacz_mesh_loader_neoforge_file}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = java_version as int
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Elite X Quality Guns",
                "Specification-Vendor"    : "Argos Williams",
                "Specification-Version"   : project.version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Argos Williams",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "Built-On-Minecraft"      : minecraft_version
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${rootProject.projectDir}/mcmodsrepo"
        }
    }
}
