# Shared Gradle settings for every module.
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# Mod metadata (used by the loader modules and the universal wrapper).
mod_version=6.1
mod_id=elitex
mod_group=com.argos_garcia.elitex
mod_name=Elite X Quality Guns
mod_authors=Argos Williams
mod_license=All Rights Reserved, Creative Commons Attribution
mod_description=Elite x Quality Guns brings a fresh arsenal of immersive and reimagined firearms to TaCZ. Some weapons are inspired by iconic video games, offering unique designs and features never seen before in Minecraft.

# Minecraft / Java for both loaders (26.3 runs on Java 25 and ships
# unobfuscated class names, so neither loader needs a remapping step).
java_version=25
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
fabric_minecraft_version_range=>=26.3 <26.4

# NeoForge 26.3 (ModDevGradle, Mojang/unobfuscated names - no Parchment).
neo_version=26.3.0.95
# javafml loader version (unchanged across the 1.20.5+ metadata format).
neoforge_loader_version_range=[4,)
# NeoForge artifact version required by the TaCZ Renovated 26.3 build.
neoforge_version_range=[26.3.0.51-beta,)

# Fabric 26.3 (Fabric Loom, unobfuscated Mojang names - no Yarn).
loader_version=0.19.5
fabric_loader_version_range=>=0.19.5
fabric_version=0.163.0+26.3

# Optional configuration UI (maven coordinates only, never bundled into the jar).
modmenu_version=21.0.0


tacz_neoforge_file=9089853
tacz_fabric_file=9282484
forge_config_api_port_fabric_file=8938808
