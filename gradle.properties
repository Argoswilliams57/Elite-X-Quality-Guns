# Shared Gradle settings for every module.
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# Mod metadata (used by the loader modules and the universal wrapper).
mod_version=6.1
mod_id=elitex
mod_group=com.argos_garcia.elitex
mod_name=Elite X Quality Guns
mod_authors=Argos Williams
mod_license=All Rights Reserved, Creative Commons Attribution
mod_description=Elite x Quality Guns brings a fresh arsenal of immersive and reimagined firearms to TaCZ. Some weapons are inspired by iconic video games, offering unique designs and features never seen before in Minecraft.

# Minecraft / Java for both loaders (1.21.1 runs on Java 21).
java_version=21
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
fabric_minecraft_version_range=>=1.21.1 <1.22

# NeoForge 1.21.1 (ModDevGradle).
neo_version=21.1.251
neo_form_version=1.21.1-20240808.144430
neoforge_loader_version_range=[4,)
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric 1.21.1 (Fabric Loom + Yarn).
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
fabric_loader_version_range=>=0.17.2
fabric_version=0.116.17+1.21.1

# Optional configuration UI (maven coordinates only, never bundled into the jar).
modmenu_version=11.0.3

# ---------------------------------------------------------------------------
# TaCZ 1.21.1 builds (Curse Maven file ids).
#   tacz NeoForge  : [UNOFFICIAL] TaCZ NeoForge Port 1.1.8-hotfix-r7
#   tacz Fabric    : TaCZ: Refabricated 0.7.0-forge1.1.8-hotfix
#   mesh loader    : TacZ Mesh Loader 0.1.8.1 (NeoForge) / 0.1.8 (Fabric)
#   config port    : Forge Config API Port 21.1.6 (Fabric), required by Refabricated
#
# Fabric must stay on Refabricated 0.7.0: 0.7.1 removed
# cn.sh1rocu.tacz.api.event.RenderTickEvent, which TacZ Mesh Loader 0.1.8
# Fabric (its ShaderStateTracker) links against. 0.7.1 therefore crashes at
# startup with NoClassDefFoundError: RenderTickEvent. 0.7.0 still ships it and
# is otherwise API-identical for everything this mod uses.
# ---------------------------------------------------------------------------
tacz_neoforge_file=9027337
tacz_fabric_file=8153698
tacz_mesh_loader_neoforge_file=9296540
tacz_mesh_loader_fabric_file=9014986
forge_config_api_port_fabric_file=7213608
