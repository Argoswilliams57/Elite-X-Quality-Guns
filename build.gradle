plugins {
    id 'base'
    // Both loader toolchains are applied in their own subprojects; the root only
    // declares the plugin versions so every module resolves the same ones.
    id 'fabric-loom' version '1.17.21' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

allprojects {
    group = mod_group
    version = mod_version
}

// The universal packaging task reads the remapped Fabric jar and the NeoForge
// jar. Evaluate those projects first so their archive tasks exist when this
// root script registers the task.
evaluationDependsOn(':fabric')
evaluationDependsOn(':neoforge')

def universalFabricJar = "${mod_id}-fabric-${minecraft_version}.jar"
def universalNeoForgeJar = "${mod_id}-neoforge-${minecraft_version}.jar"

def universalProperties = [
        mod_id                         : mod_id,
        mod_name                       : mod_name,
        mod_version                    : mod_version,
        mod_group_id                   : mod_group,
        mod_license                    : mod_license,
        mod_authors                    : mod_authors,
        mod_description                : mod_description,
        minecraft_version              : minecraft_version,
        minecraft_version_range        : minecraft_version_range,
        fabric_minecraft_version_range : fabric_minecraft_version_range,
        fabric_loader_version_range    : fabric_loader_version_range,
        neoforge_loader_version_range  : neoforge_loader_version_range,
        universal_fabric_jar           : universalFabricJar,
        universal_neoforge_jar         : universalNeoForgeJar
]

def fabricRemapJar = project(':fabric').tasks.named('remapJar')
def neoForgeJar = project(':neoforge').tasks.named('jar')

/**
 * Assembles one distributable jar containing both loader variants.
 *
 * The outer jar is a tiny wrapper with Fabric and NeoForge metadata. Each loader
 * loads only its own nested mod through that loader's standard nested-jar
 * mechanism: Fabric reads the {@code jars} entry in fabric.mod.json, and
 * NeoForge reads the JarJar metadata. The nested jars keep their original
 * mappings and metadata, so they are exactly the same production jars that the
 * normal loader-specific builds produce.
 */
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds a single universal jar for Fabric and NeoForge in dist/.'

    archiveFileName = "Elite X Quality Guns - Universal ${minecraft_version}.jar"
    destinationDirectory = layout.projectDirectory.dir('dist')

    dependsOn(fabricRemapJar, neoForgeJar)

    from(fabricRemapJar.flatMap { it.archiveFile }) {
        into 'META-INF/jars'
        rename { universalFabricJar }
    }
    from(neoForgeJar.flatMap { it.archiveFile }) {
        into 'META-INF/jars'
        rename { universalNeoForgeJar }
    }

    from('gradle/universal') {
        expand(universalProperties)
    }

    manifest {
        attributes(
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : "${mod_name} (Universal)",
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        )
    }

    // Fail loudly if a future change starts producing colliding entries. The
    // loader variants are nested jars, so their classes and resources cannot
    // collide on either loader's classpath.
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// `./gradlew build` builds both loader modules and the universal jar.
tasks.named('build') {
    dependsOn ':neoforge:build', ':fabric:build'
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the NeoForge and Fabric releases (and the universal jar).'
    dependsOn ':neoforge:build', ':fabric:build', 'universalJar'
}

tasks.named('assemble') {
    dependsOn 'universalJar'
}
